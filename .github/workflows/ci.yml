name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: getter
          POSTGRES_PASSWORD: getter
          POSTGRES_DB: getter_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U getter -d getter_test" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check src tests migrations
      - run: uv run ruff format --check src tests migrations
      - run: uv run mypy
      - name: Tests on SQLite
        run: uv run pytest -q
      - name: Grading through real Redis and arq
        run: uv run pytest -q tests/test_worker.py
        env:
          GETTER_TEST_REDIS_URL: redis://localhost:6379/15
      # Runs first, while the database is still empty.
      - name: Migrations match the models
        run: uv run alembic upgrade head && uv run alembic check
        env:
          GETTER_DATABASE_URL: postgresql+psycopg://getter:getter@localhost:5432/getter_test
      - name: Tests on Postgres
        run: uv run pytest -q
        env:
          GETTER_TEST_DATABASE_URL: postgresql+psycopg://getter:getter@localhost:5432/getter_test
      - name: Evals harness runs
        run: uv run python -m getter_api.evals

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @getter/web lint
      - run: pnpm --filter @getter/web test
      - run: pnpm --filter @getter/web build

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
        working-directory: services/api
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @getter/web exec playwright install --with-deps chromium
      - run: pnpm --filter @getter/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8100
      - run: pnpm --filter @getter/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
