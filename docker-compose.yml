# Local stack: Postgres plus the API on the offline dev models.
#   docker compose up --build
# The website runs separately with `pnpm web:dev` (http://localhost:3000).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: getter
      POSTGRES_PASSWORD: getter
      POSTGRES_DB: getter
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U getter"]
      interval: 2s
      retries: 20

  api:
    build: services/api
    environment:
      GETTER_DATABASE_URL: postgresql+psycopg://getter:getter@postgres:5432/getter
      GETTER_CORS_ORIGINS: '["http://localhost:3000"]'
      # Set GETTER_LLM_CONFIG and provider keys to use real models.
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}

volumes:
  pgdata:
