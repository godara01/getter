id: devops-junior-mid
version: 1
title: DevOps and SRE practice interview
rubric: devops-junior-mid
levels: [junior, mid]
intro: >-
  Hi, I'm your practice interviewer for a DevOps and SRE role. We'll go
  through five short sections: systems you have run, Linux troubleshooting,
  containers and CI, a crashing container, and an incident. Some questions
  come with a practice terminal: run the commands you would run, then say
  what you found and why. Nothing runs for real, and nothing here is shared
  with companies.
sections:
  - id: past_work
    title: Systems you have run
    time_limit_minutes: 8
    max_followups: 2
    skills: [ownership_communication, infrastructure]
    questions:
      - id: past_system
        prompt: >-
          Tell me about a system you deployed or helped keep running. Where
          did it run, how did code get to production, and what was the worst
          problem you dealt with on it?
        look_for:
          - Concrete setup (cloud, servers, containers, pipeline)
          - Their own part versus the team's
          - What went wrong, what they did, and what changed afterwards
  - id: linux
    title: Linux troubleshooting
    time_limit_minutes: 10
    max_followups: 2
    skills: [linux_networking]
    questions:
      - id: port_443
        prompt: |-
          A web server on a Linux VM stopped answering on port 443 from the
          internet. On the box itself:

          ```
          $ systemctl status nginx
          ● nginx.service - A high performance web server
               Active: active (running) since Mon 09:12:04 IST
          $ curl -sk -o /dev/null -w '%{http_code}' https://localhost
          200
          ```

          From your laptop the connection times out. Use the terminal to
          investigate this box, then tell me what you found and what you
          would change.
        look_for:
          - Checks the listening address (ss -tlnp), not just the process
          - Checks host firewall (iptables, nftables, ufw) and cloud security group
          - Separates DNS, network path and application with tools like dig, nc or curl
        terminal:
          hostname: web-01
          welcome: "Last login: Mon 09:30 from 10.0.0.5. Type commands; nothing runs for real."
          rules:
            - pattern: 'systemctl status nginx(\.service)?'
              output: |-
                ● nginx.service - A high performance web server
                     Loaded: loaded (/lib/systemd/system/nginx.service; enabled)
                     Active: active (running) since Mon 09:12:04 IST; 31min ago
                   Main PID: 812 (nginx)
            - pattern: 'curl( -[a-zA-Z]+)* (https://)?(localhost|127\.0\.0\.1)(:443)?/?'
              output: "200"
            - pattern: 'curl( -[a-zA-Z]+)* (https://)?(web-01|10\.0\.1\.12)(:443)?/?'
              output: "200"
            - pattern: '(ss|netstat) -[a-z]*l[a-z]*(n[a-z]*)?p?[a-z]*'
              output: |-
                State   Recv-Q  Send-Q  Local Address:Port  Peer Address:Port  Process
                LISTEN  0       511     0.0.0.0:80          0.0.0.0:*          users:(("nginx",pid=812,fd=6))
                LISTEN  0       511     0.0.0.0:443         0.0.0.0:*          users:(("nginx",pid=812,fd=7))
                LISTEN  0       128     0.0.0.0:22          0.0.0.0:*          users:(("sshd",pid=611,fd=3))
            - pattern: 'ufw status( verbose| numbered)?'
              unless: [ufw_443_open]
              output: |-
                Status: active

                To                         Action      From
                --                         ------      ----
                22/tcp                     ALLOW       Anywhere
                80/tcp                     ALLOW       Anywhere
            - pattern: 'ufw status( verbose| numbered)?'
              requires: [ufw_443_open]
              output: |-
                Status: active

                To                         Action      From
                --                         ------      ----
                22/tcp                     ALLOW       Anywhere
                80/tcp                     ALLOW       Anywhere
                443/tcp                    ALLOW       Anywhere
            - pattern: 'ufw allow (443|443/tcp|https)'
              sets: [ufw_443_open]
              output: Rule added
            - pattern: '(iptables -S|iptables -L( -n)?( -v)?|nft list ruleset)'
              output: |-
                -P INPUT DROP
                -A INPUT -p tcp -m tcp --dport 22 -j ACCEPT
                -A INPUT -p tcp -m tcp --dport 80 -j ACCEPT
            - pattern: '(nc|ncat) -[a-z]*z[a-z]* (web-01|10\.0\.1\.12|localhost) 443'
              unless: [ufw_443_open]
              output: "nc: connect to web-01 port 443 (tcp) timed out: Operation now in progress"
            - pattern: '(nc|ncat) -[a-z]*z[a-z]* (web-01|10\.0\.1\.12|localhost) 443'
              requires: [ufw_443_open]
              output: "Connection to web-01 443 port [tcp/https] succeeded!"
            - pattern: 'ip (a|addr|address)( show)?'
              output: |-
                2: eth0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500
                    inet 10.0.1.12/24 brd 10.0.1.255 scope global eth0
            - pattern: 'dig( \+short)? [a-z0-9.-]+'
              output: 203.0.113.40
      - id: disk_full
        prompt: >-
          `df -h` shows the root disk at 100%, but `du -sh /*` only adds up to
          about 40% of it. Use the terminal to find out what is going on, then
          tell me the cause and how you free the space safely.
        look_for:
          - Deleted files still held open by a process (lsof +L1)
          - Restarting or signalling the process, or truncating instead of deleting logs
          - Log rotation to stop it happening again
        terminal:
          hostname: app-02
          welcome: "Last login: Mon 14:50 from 10.0.0.5. Type commands; nothing runs for real."
          rules:
            - pattern: 'df( -[a-zA-Z]+)*( /)?'
              unless: [space_freed]
              output: |-
                Filesystem      Size  Used Avail Use% Mounted on
                /dev/nvme0n1p1   50G   50G     0 100% /
                tmpfs           2.0G     0  2.0G   0% /dev/shm
            - pattern: 'df( -[a-zA-Z]+)*( /)?'
              requires: [space_freed]
              output: |-
                Filesystem      Size  Used Avail Use% Mounted on
                /dev/nvme0n1p1   50G   19G   31G  38% /
                tmpfs           2.0G     0  2.0G   0% /dev/shm
            - pattern: 'du( -[a-zA-Z]+)* /\*'
              output: |-
                4.1G	/usr
                9.2G	/var
                3.0G	/home
                1.6G	/opt
            - pattern: 'du( -[a-zA-Z]+)* /var(/\*)?'
              output: |-
                8.1G	/var/lib
                1.0G	/var/log
            - pattern: 'ls( -[a-zA-Z]+)* /var/log(/app)?/?'
              output: |-
                total 1.0G
                -rw-r--r-- 1 app app  42M Mon 14:49 access.log
                -rw-r--r-- 1 app app 8.0M Mon 14:49 worker.log
            - pattern: 'lsof \+L1'
              unless: [space_freed]
              output: |-
                COMMAND  PID USER   FD   TYPE DEVICE    SIZE/OFF NLINK     NODE NAME
                java    2210  app    4w   REG  259,1 31138512896     0  1311071 /var/log/app/app.log.1 (deleted)
            - pattern: 'lsof \+L1'
              requires: [space_freed]
              output: ""
            - pattern: '(lsof -p 2210|ls -l /proc/2210/fd)'
              output: |-
                lrwx------ 1 app app 64 Mon 14:51 3u -> socket:[28813]
                l-wx------ 1 app app 64 Mon 14:51 4w -> /var/log/app/app.log.1 (deleted)
            - pattern: '(ps( -?[a-z]+)*|pgrep -a java)'
              output: |-
                PID USER     COMMAND
                2210 app     java -jar /opt/app/service.jar
            - pattern: '(systemctl restart app|kill -HUP 2210|truncate -s 0 /proc/2210/fd/4|: > /proc/2210/fd/4|> /proc/2210/fd/4)'
              sets: [space_freed]
              output: ""
            - pattern: 'cat /etc/logrotate\.d/app'
              output: |-
                # no rotation configured for /var/log/app
  - id: containers_ci
    title: Containers and CI
    time_limit_minutes: 8
    max_followups: 2
    skills: [containers_ci]
    questions:
      - id: dockerfile_review
        prompt: |-
          Review this Dockerfile for a Node.js API. What would you change and
          why?

          ```dockerfile
          FROM node:latest
          COPY . /app
          WORKDIR /app
          RUN npm install
          EXPOSE 3000
          CMD ["npm", "start"]
          ```
        look_for:
          - Pin the base image version; prefer a slim image
          - Copy package files and install before copying the source, for layer caching
          - npm ci, production dependencies only, .dockerignore
          - Run as a non-root user; multi-stage build
  - id: crashloop
    title: A crashing container
    time_limit_minutes: 8
    max_followups: 1
    skills: [containers_ci, linux_networking]
    questions:
      - id: container_restarting
        prompt: >-
          The `payments-api` container on this host keeps restarting every
          few seconds after a deploy. Use the terminal to find out why, then
          tell me the cause and the fix you would ship.
        look_for:
          - Reads container state and logs (docker ps, docker logs) before changing anything
          - Finds the missing or wrong configuration from the log, not by guessing
          - Fixes through the image or deploy config rather than by hand on the host, and adds a startup check
        terminal:
          hostname: docker-01
          welcome: "Type commands; nothing runs for real."
          rules:
            - pattern: 'docker ps( -a)?'
              output: |-
                CONTAINER ID  IMAGE                    STATUS                          NAMES
                a1f3c2d9e801  payments-api:2026.10.24  Restarting (1) 4 seconds ago    payments-api
                77be0d1c42aa  redis:7-alpine           Up 3 days                       redis
            - pattern: 'docker logs( --tail [0-9]+| -n [0-9]+)* payments-api( --tail [0-9]+)?'
              output: |-
                INFO  starting payments-api 2026.10.24
                INFO  connecting to redis at redis:6379
                ERROR missing required environment variable PAYMENTS_DB_URL
                exit status 1
            - pattern: 'docker inspect payments-api'
              output: |-
                [{"Name": "/payments-api", "State": {"Status": "restarting", "ExitCode": 1, "OOMKilled": false},
                  "Config": {"Env": ["REDIS_URL=redis://redis:6379", "LOG_LEVEL=info"]}}]
            - pattern: 'docker (inspect|stats).*'
              output: "No stats: the container is restarting."
            - pattern: 'docker exec .*'
              output: "Error response from daemon: Container a1f3c2d9e801 is restarting, wait until the container is running"
            - pattern: 'cat (\./)?(\.env|docker-compose\.ya?ml)'
              output: |-
                services:
                  payments-api:
                    image: payments-api:2026.10.24
                    environment:
                      REDIS_URL: redis://redis:6379
                      LOG_LEVEL: info
            - pattern: 'git (log|diff)( .*)?'
              output: |-
                9c1e7aa Move database settings to PAYMENTS_DB_URL (was DATABASE_URL)
            - pattern: 'free( -[a-z]+)?'
              output: |-
                total   used   free
                Mem:    7.8Gi  2.1Gi  4.9Gi
  - id: incident
    title: An incident
    time_limit_minutes: 8
    max_followups: 2
    skills: [incident_response, reliability_practices]
    questions:
      - id: pool_exhausted
        prompt: |-
          A deploy went out at 14:02. By 14:05 the error rate is 8% (normally
          under 0.5%) and p99 latency is 4 seconds. The logs show:

          ```
          14:04:51 ERROR db: connection pool exhausted (max=10, waiting=37)
          14:04:52 WARN  http: GET /orders 503 4012ms
          14:04:52 ERROR db: connection pool exhausted (max=10, waiting=41)
          ```

          You are on call. What do you do in the first ten minutes, and how
          do you find the root cause afterwards?
        look_for:
          - Mitigates first by rolling back the deploy, and communicates
          - Links the deploy to the pool exhaustion (leaked connections, slower query, lower pool size)
          - Uses metrics and the diff to confirm the cause; adds an alert or test so it doesn't recur
